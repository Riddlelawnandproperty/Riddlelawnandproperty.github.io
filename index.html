<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Lawncare and Services | Temple, TX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-black text-green-400">

  <!-- Header -->
  <header class="bg-zinc-950 shadow-sm sticky top-0 z-50 border-b border-green-900">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-green-400">Family Lawncare</h1>
        <p class="text-lg text-green-500 -mt-1">and Services</p>
      </div>
      <a href="#quote" class="bg-green-600 hover:bg-green-500 text-black px-6 py-3 rounded-full font-medium transition">
        Get Quote
      </a>
    </div>
  </header>

  <!-- Hero -->
  <section class="bg-black h-screen flex items-center text-white">
    <div class="max-w-4xl mx-auto px-6 text-center">
      <h2 class="text-5xl md:text-6xl font-bold mb-4 text-green-400">Caring for Your Lawn<br>Like It's Our Own</h2>
      <p class="text-xl mb-8 text-green-300">lawn care & services in Temple, Texas</p>
      <a href="#quote" class="inline-block bg-green-600 hover:bg-green-500 text-black text-xl px-10 py-4 rounded-full font-semibold transition">
        📸 Get Instant Quote
      </a>
    </div>
  </section>

  <!-- Quote Section -->
  <section id="quote" class="py-16 bg-zinc-950">
    <div class="max-w-lg mx-auto px-6">
      <div class="text-center mb-10">
        <h2 class="text-3xl font-bold text-green-400">Get a Quote Now</h2>
        <p class="text-green-300 mt-2">Take or upload photos/videos of your lawn & flowerbeds</p>
      </div>

      <form name="lawn-quote" method="POST" data-netlify="true" class="space-y-6">
        <input type="hidden" name="form-name" value="lawn-quote">

        <div>
          <label class="block text-sm mb-1 text-green-400">Your Name</label>
          <input type="text" name="name" required class="w-full px-4 py-3 bg-zinc-900 border border-green-900 rounded-xl text-white">
        </div>

        <div>
          <label class="block text-sm mb-1 text-green-400">Phone Number</label>
          <input type="tel" name="phone" required class="w-full px-4 py-3 bg-zinc-900 border border-green-900 rounded-xl text-white">
        </div>

        <div>
          <label class="block text-sm mb-1 text-green-400">Address</label>
          <input type="text" name="address" required placeholder="123 Main St, Temple, TX" class="w-full px-4 py-3 bg-zinc-900 border border-green-900 rounded-xl text-white">
        </div>

        <div>
          <label class="block text-sm mb-1 text-green-400">Notes about your yard</label>
          <textarea name="message" rows="4" placeholder="Front yard needs mowing, weeds in flowerbeds, etc..." 
                    class="w-full px-4 py-3 bg-zinc-900 border border-green-900 rounded-xl text-white"></textarea>
        </div>

        <div>
          <label class="block text-sm mb-2 text-green-400">Upload Photos or Videos</label>
          <input type="file" id="media" name="photos" accept="image/*,video/*" multiple capture="environment" 
                 class="block w-full text-green-300 bg-zinc-900 border border-green-900 rounded-xl p-3">
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-black py-5 rounded-2xl text-lg font-semibold">
          Submit & Request Quote
        </button>
      </form>
    </div>
  </section>

  <!-- Contact -->
  <section class="py-12 bg-zinc-950">
    <div class="max-w-4xl mx-auto px-6 text-center">
      <h3 class="text-2xl font-bold mb-6 text-green-400">Contact Us</h3>
      <div class="flex flex-col gap-6">
        <a href="tel:12548567094" "1254392183" class="flex items-center justify-center gap-3 text-green-400 hover:text-green-300 text-xl">
          <i class="fa-solid fa-phone"></i>
          <strong>(254) 856-7094</strong>
        </a>
        <a href="mailto:Familylawncareandservice@gmail.com" class="flex items-center justify-center gap-3 text-green-400 hover:text-green-300 text-xl">
          <i class="fa-solid fa-envelope"></i>
          <strong>Familylawncareandservice@gmail.com</strong>
        </a>
      </div>
    </div>
  </section>

  <!-- Social Media -->
  <section class="py-10 bg-zinc-950 border-t border-green-900">
    <div class="max-w-4xl mx-auto px-6 text-center">
      <p class="text-lg font-medium mb-4 text-green-400">Follow Us</p>
      <div class="flex justify-center gap-8 text-4xl">
        <a href="https://www.facebook.com/share/1EP2wYGNuT/" target="_blank" class="text-blue-500 hover:text-blue-400 transition">
          <i class="fa-brands fa-facebook"></i>
        </a>
      </div>
    </div>
  </section>

  <script>
    const mediaInput = document.getElementById('media');
    const preview = document.getElementById('preview');
    const previewContent = document.getElementById('preview-content');

    // Preview for uploaded files
    mediaInput.addEventListener('change', function(e) {
      if (!preview) return;
      preview.classList.remove('hidden');
      previewContent.innerHTML = '';

      Array.from(e.target.files).forEach(file => {
        const div = document.createElement('div');
        div.className = 'bg-zinc-900 p-3 rounded-2xl';

        if (file.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          img.className = 'w-full rounded-xl';
          div.appendChild(img);
        } else if (file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = URL.createObjectURL(file);
          video.controls = true;
          video.className = 'w-full rounded-xl';
          div.appendChild(video);
        }
        previewContent.appendChild(div);
      });
    });
  </script>

</body>
</html>
