<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Lawncare and Services | Temple, TX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-black text-green-400">

  <!-- Header -->
  <header class="bg-zinc-950 shadow-sm sticky top-0 z-50 border-b border-green-900">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-green-400">Family Lawncare</h1>
        <p class="text-lg text-green-500 -mt-1">and Services</p>
      </div>
      <a href="#quote" class="bg-green-600 hover:bg-green-500 text-black px-6 py-3 rounded-full font-medium transition">
        Get Quote
      </a>
    </div>
  </header>

  <!-- Hero -->
  <section class="bg-black h-screen flex items-center text-white">
    <div class="max-w-4xl mx-auto px-6 text-center">
      <h2 class="text-5xl md:text-6xl font-bold mb-4 text-green-400">Caring for Your Lawn<br>Like It's Our Own</h2>
      <p class="text-xl mb-8 text-green-300">lawn care & services in Temple, Texas</p>
      <a href="#quote" class="inline-block bg-green-600 hover:bg-green-500 text-black text-xl px-10 py-4 rounded-full font-semibold transition">
        📸 Get Instant Quote
      </a>
    </div>
  </section>

  <!-- Quote Section -->
  <section id="quote" class="py-16 bg-zinc-950">
    <div class="max-w-lg mx-auto px-6">
      <div class="text-center mb-10">
        <h2 class="text-3xl font-bold text-green-400">Get a Quote Now</h2>
        <p class="text-green-300 mt-2">Take or upload photos/videos of your lawn & flowerbeds</p>
      </div>

      <form name="lawn-quote" method="POST" data-netlify="true" class="space-y-6">
        <input type="hidden" name="form-name" value="lawn-quote">

        <div>
          <label class="block text-sm mb-1 text-green-400">Your Name</label>
          <input type="text" name="name" required class="w-full px-4 py-3 bg-zinc-900 border border-green-900 rounded-xl text-white">
        </div>

        <div>
          <label class="block text-sm mb-1 text-green-400">Phone Number</label>
          <input type="tel" name="phone" required class="w-full px-4 py-3 bg-zinc-900 border border-green-900 rounded-xl text-white">
        </div>

        <div>
          <label class="block text-sm mb-1 text-green-400">Address</label>
          <input type="text" name="address" required placeholder="123 Main St, Temple, TX" class="w-full px-4 py-3 bg-zinc-900 border border-green-900 rounded-xl text-white">
        </div>

        <div>
          <label class="block text-sm mb-1 text-green-400">Notes about your yard</label>
          <textarea name="message" rows="4" placeholder="Front yard needs mowing, weeds in flowerbeds, etc..." 
                    class="w-full px-4 py-3 bg-zinc-900 border border-green-900 rounded-xl text-white"></textarea>
        </div>

        <!-- Media Upload -->
        <div>
          <label class="block text-sm mb-2 text-green-400">Upload Photos or Videos</label>
          <input type="file" id="media" name="photos" accept="image/*,video/*" multiple capture="environment" class="block w-full text-green-300 bg-zinc-900 border border-green-900 rounded-xl p-3">
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-black py-5 rounded-2xl text-lg font-semibold">
          Submit & Request Quote
        </button>
      </form>
    </div>
  </section>

  <script>
    // Simple success message after submit
    document.querySelector('form').addEventListener('submit', function() {
      setTimeout(() => {
        alert("Thank you! Your quote request has been submitted. We'll contact you soon.");
      }, 500);
    });
  </script>

</body>
</html>
